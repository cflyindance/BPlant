name: Deploy admin-web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin-web/**"
      - "!admin-web/dist/**"
      - ".github/workflows/deploy-admin-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-admin-web
  cancel-in-progress: true

jobs:
  build-and-publish-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit dist to main
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f admin-web/dist
          if git diff --staged --quiet; then
            echo "dist unchanged, skip commit"
            exit 0
          fi
          git commit -m "chore: rebuild admin-web dist [skip ci]"
          git push
